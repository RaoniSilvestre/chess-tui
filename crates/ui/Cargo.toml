[package]
name = "ui"
version = "2.8.0"
edition = "2024"
license = "MIT"
authors = ["Thomas Mauran"]
repository = "https://github.com/thomas-mauran/chess-tui"
publish = false

[dependencies]
model = { path = "../model" }
game = { path = "../game" }
theme = { path = "../theme" }
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui = { version = "0.30.0", features = ["serde"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rodio = { version = "0.23", optional = true }
shakmaty = "0.27.3"

[features]
sound = ["rodio"]
