[package]
name = "app"
version = "2.8.0"
edition = "2024"
license = "MIT"
authors = ["Thomas Mauran"]
repository = "https://github.com/thomas-mauran/chess-tui"
publish = false

[dependencies]
model = { path = "../model" }
game = { path = "../game" }
ui = { path = "../ui" }
theme = { path = "../theme" }
net = { path = "../net" }
log = "0.4.32"
lichess = { path = "../lichess" }
rand = "0.10.1"
ratatui = { version = "0.30.0", features = ["serde"] }
shakmaty = "0.27.3"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
tachyonfx = "0.25.0"
throbber-widgets-tui = "0.11.0"

[features]
sound = []
